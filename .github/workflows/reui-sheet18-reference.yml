name: Inspect ReUI sheet-18 public preview

on:
  push:
    branches:
      - feature/reui-nova-renovation-gantt-2027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect public ReUI sheet HTML
        run: node scripts/inspect-reui-sheet18.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reui-sheet18-public-html-reference
          path: reui-sheet18-reference/
          retention-days: 7
          if-no-files-found: ignore
