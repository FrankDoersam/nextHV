name: ReUI demo screenshots

on:
  push:
    branches:
      - feature/reui-nova-renovation-gantt-2027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/e2e.sqlite
      E2E_PASSWORD: local-e2e-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: gd, mbstring, pdo_sqlite, fileinfo, intl, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - name: Prepare isolated screenshot database
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/e2e.sqlite
          php artisan migrate --force
          php artisan db:seed --class=PropertySeeder --force
          php tests/e2e/seed.php
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture two ReUI pages
        run: npx playwright test --config=playwright.reui-screenshots.config.ts
      - name: Upload three PNGs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reui-nova-three-screenshots
          path: |
            screenshots/kernsanierung-2027.png
            screenshots/kernsanierung-finanz-sheet.png
            screenshots/csv-import-nova-select-geoeffnet.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reui-screenshot-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Screenshots summary
        if: success()
        run: |
          echo "## ReUI Screenshots" >> "$GITHUB_STEP_SUMMARY"
          echo "- kernsanierung-2027.png – Gantt (März 2027)" >> "$GITHUB_STEP_SUMMARY"
          echo "- kernsanierung-finanz-sheet.png – Budget & Rechnungen" >> "$GITHUB_STEP_SUMMARY"
          echo "- csv-import-nova-select-geoeffnet.png – Schritt 1, unteres Select geöffnet" >> "$GITHUB_STEP_SUMMARY"
          echo "1600×1200 Chromium (full-page), isolierte Demo-Daten" >> "$GITHUB_STEP_SUMMARY"
